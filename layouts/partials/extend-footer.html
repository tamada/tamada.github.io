<style>
/* Cookie consent banner */
.cookie-banner {
  position: fixed;
  left: 1rem;
  right: 1rem;
  bottom: 1rem;
  z-index: 50;
  max-width: 40rem;
  margin: 0 auto;
  padding: 1rem;
  border-radius: 0.5rem;
  background: rgb(var(--color-neutral-800));
  color: rgb(var(--color-neutral-50));
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  font-size: 0.875rem;
}
.cookie-banner[hidden] { display: none; }
.cookie-banner a { text-decoration: underline; }
.cookie-banner-buttons { display: flex; gap: 0.5rem; margin-top: 0.75rem; justify-content: flex-end; }
.cookie-banner-buttons button {
  padding: 0.35rem 0.9rem;
  border: 1px solid currentColor;
  border-radius: 0.375rem;
  cursor: pointer;
}
#cookie-accept { background: rgb(var(--color-primary-500)); border-color: transparent; color: #fff; }
</style>
<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie consent" hidden>
  <p>
    このサイトはアクセス解析(Google アナリティクス)に Cookie を使用します。<a href="/privacy-policy.ja/">詳細</a><br>
    This site uses cookies for access analysis (Google Analytics). <a href="/privacy-policy/">Details</a>
  </p>
  <div class="cookie-banner-buttons">
    <button type="button" id="cookie-accept">同意する / Accept</button>
    <button type="button" id="cookie-reject">拒否する / Reject</button>
  </div>
</div>
<script>
  (function () {
    var KEY = 'cookie-consent';
    var banner = document.getElementById('cookie-banner');
    function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    function decide(v) {
      save(v);
      if (typeof gtag === 'function') {
        gtag('consent', 'update', { analytics_storage: v });
      }
      banner.hidden = true;
    }
    if (!read()) { banner.hidden = false; }
    document.getElementById('cookie-accept').addEventListener('click', function () { decide('granted'); });
    document.getElementById('cookie-reject').addEventListener('click', function () { decide('denied'); });
    document.querySelectorAll('a[href="#cookie-settings"]').forEach(function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); banner.hidden = false; });
    });
  })();
</script>
